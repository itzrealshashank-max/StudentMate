{% extends "base.html" %}

{% block title %}Edit Attendance | StudentMate{% endblock %}

{% block content %}

<div class="container py-4">

```
<div class="card shadow-sm p-4">
    <h2>Edit Attendance</h2>
    <p class="text-muted">Update your attendance record.</p>

    <form method="POST" class="row g-3">

        <div class="col-md-4">
            <label for="date" class="form-label">Date</label>
            <input type="date" id="date" name="date"
                   class="form-control"
                   value="{{ item.class_date }}"
                   required>
        </div>

        <div class="col-md-4">
            <label for="total_classes" class="form-label">
                Total Classes Held
            </label>
            <input type="number" id="total_classes"
                   name="total_classes"
                   class="form-control" min="1" step="1"
                   value="{{ item.total_classes }}" required>
        </div>

        <div class="col-md-4">
            <label for="attended_classes" class="form-label">
                Classes Attended
            </label>
            <input type="number" id="attended_classes"
                   name="attended_classes"
                   class="form-control" min="0" step="1"
                   value="{{ item.attended_classes }}" required>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">
                Update Attendance
            </button>

            <a href="{{ url_for('attendance') }}"
               class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>
</div>
```

</div>
{% endblock %}
